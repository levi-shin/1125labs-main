name: Daily Morning Briefing

on:
  schedule:
    # UTC 기준 23:00 = 한국 시간(KST) 오전 08:00 (월~금 실행)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # GitHub 웹 Actions 탭에서 수동 실행 버튼 활성화

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 직접 설치
        run: |
          pip install requests beautifulsoup4 yfinance feedparser

      - name: 브리핑 스크립트 실행 및 Slack 전송
        env:
          SLACK_WEBHOOK_URL: https://hooks.slack.com/services/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
        run: |
          python briefing.py
