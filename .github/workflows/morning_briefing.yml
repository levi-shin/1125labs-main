name: Daily Morning Briefing

on:
  schedule:
    # UTC 23:17 = 한국시간(KST) 오전 08:17
    # 일~목 UTC 실행 → 월~금 KST 실행
    - cron: '40 0 * * 0-4'

  # GitHub Actions에서 수동 실행 가능
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 직접 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance feedparser

      - name: 브리핑 스크립트 실행 및 Slack 전송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python briefing.py
