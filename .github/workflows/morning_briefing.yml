name: Daily Morning Briefing

on:
  schedule:
    # 한국시간 평일 오전 8:17
    - cron: '17 8 * * 1-5'
      timezone: 'Asia/Seoul'
jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 직접 설치
        run: |
          pip install requests beautifulsoup4 yfinance feedparser

      - name: 브리핑 스크립트 실행 및 Slack 전송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python briefing.py
