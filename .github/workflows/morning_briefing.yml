name: Daily Morning Briefing

on:
  schedule:
    # UTC 기준 23:00 = 한국 시간(KST) 오전 08:00 (월~금 실행)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # GitHub 웹에서 수동으로 즉시 테스트 실행 가능하게 하는 옵션

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: 브리핑 스크립트 실행
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python briefing.py
